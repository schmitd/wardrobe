name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run validate generated
      - run: bun run lint
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web playwright install --with-deps chromium
      - run: bun run validate browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: output/playwright
          retention-days: 7
  review-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --cwd tooling/review-events --frozen-lockfile --ignore-scripts
      - run: bun run --cwd tooling/review-events typecheck
      - run: bun run --cwd tooling/review-events test
  merge-checks:
    name: Merge checks
    if: always()
    needs: [build, browser, review-events]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          BUILD: ${{ needs.build.result }}
          BROWSER: ${{ needs.browser.result }}
          REVIEW_EVENTS: ${{ needs.review-events.result }}
        run: test "$BUILD" = success && test "$BROWSER" = success && test "$REVIEW_EVENTS" = success
