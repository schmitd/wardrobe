name: Build and submit iOS to TestFlight

on:
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS App Store archive
    type: build
    params:
      platform: ios
      profile: production
    hooks:
      after_install_node_modules:
        - name: Verify TestFlight configuration
          run: bun run preflight:testflight

  testflight:
    name: Upload build to TestFlight
    type: testflight
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: Wardrobe beta build
