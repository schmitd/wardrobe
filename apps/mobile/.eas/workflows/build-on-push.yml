name: Build iOS and Android on push

on:
  push:
    branches:
      - '*'
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android preview APK
    type: build
    environment: preview
    hooks:
      after_install_node_modules:
        - name: Verify Clerk Native API
          run: bun run preflight:native-auth
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build iOS Simulator preview
    type: build
    environment: preview
    hooks:
      after_install_node_modules:
        - name: Verify Clerk Native API
          run: bun run preflight:native-auth
    params:
      platform: ios
      profile: preview-simulator

  test_android_onboarding_capture:
    name: Test Android onboarding capture
    needs: [build_android]
    type: maestro
    environment: preview
    runs_on: linux-large-nested-virtualization
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: ./maestro/android-onboarding-capture.yml
      record_screen: true

  test_ios_onboarding:
    name: Test iOS onboarding and sign-in handoff
    needs: [build_ios]
    type: maestro
    environment: preview
    runs_on: macos-medium
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: ./maestro/ios-onboarding.yml
      record_screen: true
