appId: com.wardrobe.app
---
- launchApp:
    clearState: true
- assertVisible: "Create your dream wardrobe."
- tapOn: "Start with a fit check"
- assertVisible: "Let Wardrobe use your camera"
- tapOn: "Allow camera"
- tapOn:
    text: "While using the app"
    optional: true
- assertVisible: "Keep your whole outfit in frame and wear something that feels quintessentially you."
- tapOn:
    id: "Take photo"
- assertVisible: "Review photo"
- assertVisible: "Sign in to save this fit"
- tapOn: "Sign in to save this fit"
- assertVisible: "Your wardrobe, remembered."
